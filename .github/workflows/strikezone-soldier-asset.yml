name: Bundle STRIKEZONE Soldier GLB
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/strikezone-soldier-asset.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EasyABC
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download official three.js rigged example soldier
        shell: bash
        run: |
          set -euo pipefail
          target=games/strikezone-fps/assets/soldier.glb
          mkdir -p "$(dirname "$target")"
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            "https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/models/gltf/Soldier.glb" \
            --output "$target"
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p = Path('games/strikezone-fps/assets/soldier.glb')
          data = p.read_bytes()
          assert 50_000 < len(data) < 15_000_000, f'Unexpected size: {len(data)}'
          magic, version, length = struct.unpack_from('<4sII', data)
          assert magic == b'glTF' and version == 2 and length == len(data), 'Invalid GLB format'
          print(f'Validated STRIKEZONE model: {len(data):,} bytes')
          PY
      - name: Commit local model to game repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/strikezone-fps/assets/soldier.glb
          if git diff --cached --quiet; then
            echo "Soldier model already bundled; no commit needed."
          else
            git commit -m "assets: store STRIKEZONE animated human soldier GLB locally"
            # Background TradeLens snapshots also push; replay safely on top.
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 4
            done
            echo "Could not push bundled GLB" >&2
            exit 1
          fi
