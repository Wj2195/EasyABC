name: STRIKEZONE Browser Preview Diagnosis v3.47
on:
  push:
    branches: [main]
    paths: [".github/workflows/strikezone-preview-test.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        shell: bash
        run: |
          set -e
          cd /tmp
          npm install --silent playwright@1.56.1
          ./node_modules/.bin/playwright install chromium
      - name: Test hosted STRIKEZONE in Chrome with WebGL
        shell: bash
        run: |
          cat >/tmp/sz-preview-test.cjs <<'JS'
          const {chromium}=require('/tmp/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            for (const width of [400,1280]) {
              const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
              const errs=[];
              page.on('console',m=>{if(m.type()==='error'||m.type()==='warning'||m.text().includes('STRIKEZONE'))errs.push('CONSOLE '+m.type()+': '+m.text())});
              page.on('pageerror',e=>errs.push('PAGEERROR '+e.stack));
              page.on('requestfailed',req=>errs.push('REQUEST FAILED '+req.url()+' '+req.failure()?.errorText));
              page.on('response',r=>{if(r.status()>=400)errs.push('HTTP '+r.status()+' '+r.url())});
              try{
                await page.goto('https://wj2195.github.io/EasyABC/games/strikezone-fps/?diagnostic=3.47',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(14000);
                const info=await page.evaluate(()=>({
                  previewText:document.querySelector('#szPreviewFallback')?.innerText,
                  previewVisibility:document.querySelector('#szPreviewFallback')?.style.display,
                  graphics:document.querySelector('#rendererState')?.innerText,
                  webgl2:!!document.createElement('canvas').getContext('webgl2'),
                  canvas:document.querySelector('#szOperatorCanvas')?.width,
                  lobbyHidden:document.querySelector('#mainMenu')?.classList.contains('hidden')
                }));
                console.log('=== WIDTH',width,'RESULT',JSON.stringify(info));
                for(const err of errs)console.log('=== WIDTH',width,err.slice(0,1300));
                // Skip screenshots: software WebGL canvas may hang readPixels in CI
              }catch(e){console.log('=== WIDTH',width,'TEST FAIL',e.stack)}
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/sz-preview-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strikezone-preview-diagnostic
          path: /tmp/strikezone-preview-*.png
          retention-days: 2
