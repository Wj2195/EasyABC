name: Build EasyABC Lens Pro V1.4 Fast Beauty APK
on:
  push:
    branches: [lens-pro-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Android source
        run: mkdir -p lenspro && tar -xJf lenspro-source.tar.xz -C lenspro
      - name: Check capture and beauty features
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("lenspro/app/src/main")
          f=json.loads((src/"assets/official_presets.json").read_text())["presets"]
          assert len(f)==40 and len({x["id"] for x in f})==40
          main=(src/"java/com/easyabc/lenspro/MainActivity.java").read_text()
          processor=(src/"java/com/easyabc/lenspro/BeautyProcessor.java").read_text()
          dependencies=Path("lenspro/app/build.gradle").read_text()
          for item in ["CAPTURE_MODE_MINIMIZE_LATENCY","cameraCallbackWorker","photoWorker","pendingPhotoSaves","SELFIE BEAUTY"]:
              assert item in main, item
          for item in ["face-detection:16.1.7","pose-detection:18.0.0-beta5"]:
              assert item in dependencies, item
          for item in ["applyGeometry","softenFace","drawBitmapMesh","getPoses"]:
              assert item in processor, item
          print("All 40 locked presets and fast/offline beauty features validated")
          PY
      - name: Build Android test APK
        working-directory: lenspro
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyABC-Lens-Pro-v1.4-Fast-Beauty-APK
          path: lenspro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
