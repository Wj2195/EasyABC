name: Build Lens Pro APK
on:
  push:
    branches: [lens-pro-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager not found"; exit 1; fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Android source
        run: mkdir -p lenspro && tar -xJf lenspro-source.tar.xz -C lenspro
      - name: Build APK
        working-directory: lenspro
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: EasyABC-Lens-Pro-APK
          path: lenspro/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
