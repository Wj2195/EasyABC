name: Build EasyABC Lens Pro V1.1 APK
on:
  push:
    branches: [lens-pro-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Android source
        run: mkdir -p lenspro && tar -xJf lenspro-source.tar.xz -C lenspro
      - name: Verify 30 built-in presets
        run: |
          test "$(grep -c 'a.add(p(' lenspro/app/src/main/java/com/easyabc/lenspro/FilterPreset.java)" -eq 30
          grep -q 'SCENERY PRO' lenspro/app/src/main/java/com/easyabc/lenspro/FilterPreset.java
          grep -q 'CITY VIEW' lenspro/app/src/main/java/com/easyabc/lenspro/FilterPreset.java
      - name: Build APK
        working-directory: lenspro
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyABC-Lens-Pro-V1.1-APK
          path: lenspro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
