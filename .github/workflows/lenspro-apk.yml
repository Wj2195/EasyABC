name: Build EasyABC Lens Pro V1.3 APK
on:
  push:
    branches: [lens-pro-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Android source
        run: mkdir -p lenspro && tar -xJf lenspro-source.tar.xz -C lenspro
      - name: Verify 40 distinct locked Lightroom-style recipes
        run: |
          python - <<'PY'
          import json
          p=json.load(open('lenspro/app/src/main/assets/official_presets.json'))
          items=p['presets']
          assert len(items)==40
          assert len({x['id'] for x in items})==40
          assert {c:sum(x['category']==c for x in items) for c in ('PEOPLE','SCENERY','CITY VIEW','FOOD & DRINKS')} == {'PEOPLE':10,'SCENERY':10,'CITY VIEW':10,'FOOD & DRINKS':10}
          required={'isoMin','isoMax','shutterGuide','whiteBalanceK','exposureEv','contrast','highlights','shadows','saturation','vibrance','clarity','grain','vignette','direction','hslHue','hslSat'}
          assert all(required.issubset(x) for x in items)
          print('40 locked recipes validated.')
          PY
          grep -q 'openGalleryPhoto' lenspro/app/src/main/java/com/easyabc/lenspro/MainActivity.java
          grep -q 'saveGalleryPhoto' lenspro/app/src/main/java/com/easyabc/lenspro/MainActivity.java
          grep -q 'PhotoGrader.apply' lenspro/app/src/main/java/com/easyabc/lenspro/MainActivity.java
      - name: Build APK
        working-directory: lenspro
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyABC-Lens-Pro-V1.3-Lightroom-40-Gallery-APK
          path: lenspro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
