name: Build EasyABC Lens Pro V1.2 APK
on:
  push:
    branches: [lens-pro-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Extract updated Android application
        run: mkdir -p lenspro && tar -xJf lenspro-source.tar.xz -C lenspro
      - name: Verify precisely 40 locked presets in four categories
        run: |
          test "$(grep -c 'out.add(p(' lenspro/app/src/main/java/com/easyabc/lenspro/FilterPreset.java)" -eq 40
          test "$(grep -c 'out.add(p(.*"PEOPLE"' lenspro/app/src/main/java/com/easyabc/lenspro/FilterPreset.java)" -eq 10
          test "$(grep -c 'out.add(p(.*"SCENERY"' lenspro/app/src/main/java/com/easyabc/lenspro/FilterPreset.java)" -eq 10
          test "$(grep -c 'out.add(p(.*"CITY VIEW"' lenspro/app/src/main/java/com/easyabc/lenspro/FilterPreset.java)" -eq 10
          test "$(grep -c 'out.add(p(.*"FOOD & DRINKS"' lenspro/app/src/main/java/com/easyabc/lenspro/FilterPreset.java)" -eq 10
          grep -q 'PhotoGrader.apply(input,savedFilter)' lenspro/app/src/main/java/com/easyabc/lenspro/MainActivity.java
          ! grep -q 'setBlueScale' lenspro/app/src/main/java/com/easyabc/lenspro/MainActivity.java
      - name: Build and sign test APK
        working-directory: lenspro
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyABC-Lens-Pro-V1.2-40-Filters-APK
          path: lenspro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
