<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="0 0 620 620" role="img" aria-labelledby="title desc">
<title id="title">EasyABC friendly floating robot mascot</title>
<desc id="desc">A happy silver robot with a glossy black face, red glowing eyes and a waving arm, floating in a futuristic red-lit environment.</desc>
<defs>
 <radialGradient id="ambient"><stop stop-color="#f04755" stop-opacity=".48"/><stop offset=".5" stop-color="#b42437" stop-opacity=".17"/><stop offset="1" stop-color="#f04755" stop-opacity="0"/></radialGradient>
 <linearGradient id="silver" x1=".12" y1="0" x2=".87" y2="1"><stop stop-color="#fff"/><stop offset=".22" stop-color="#f5f4f5"/><stop offset=".44" stop-color="#9fa2ae"/><stop offset=".61" stop-color="#ebedf0"/><stop offset=".82" stop-color="#a1a3ad"/><stop offset="1" stop-color="#5d6471"/></linearGradient>
 <linearGradient id="silverLite" x1=".1" y1="0" x2=".85" y2="1"><stop stop-color="#fff"/><stop offset=".36" stop-color="#d0d2dc"/><stop offset=".76" stop-color="#777d8a"/><stop offset="1" stop-color="#e7e7ee"/></linearGradient>
 <linearGradient id="red" x1=".15" y1="0" x2=".83" y2="1"><stop stop-color="#ffb4b8"/><stop offset=".17" stop-color="#ff6470"/><stop offset=".52" stop-color="#eb293d"/><stop offset=".83" stop-color="#8b0b26"/><stop offset="1" stop-color="#4b081b"/></linearGradient>
 <linearGradient id="body" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fdfdff"/><stop offset=".26" stop-color="#d7dbe2"/><stop offset=".58" stop-color="#a4abb7"/><stop offset=".8" stop-color="#f0eff3"/><stop offset="1" stop-color="#767e8c"/></linearGradient>
 <linearGradient id="visor" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#344154"/><stop offset=".22" stop-color="#0c111f"/><stop offset=".75" stop-color="#04060c"/><stop offset="1" stop-color="#2b1821"/></linearGradient>
 <radialGradient id="eyeGlow"><stop stop-color="#ff8393"/><stop offset=".6" stop-color="#ff3048"/><stop offset="1" stop-color="#c80b29"/></radialGradient>
 <filter id="redGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="drop" x="-60%" y="-60%" width="240%" height="240%"><feDropShadow dx="7" dy="22" stdDeviation="18" flood-color="#0b060c" flood-opacity=".65"/></filter>
 <filter id="smallDrop" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="3" dy="8" stdDeviation="8" flood-color="#100712" flood-opacity=".4"/></filter>
 <filter id="eyeBlush" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.robot-core{animation:robotBob 5.5s ease-in-out infinite;transform-origin:50% 50%}
.robot-hello{animation:robotHello 4s ease-in-out infinite;transform-box:fill-box;transform-origin:22% 90%}
.robot-stars{animation:robotStars 4s ease-in-out infinite alternate}
.robot-eyes{animation:robotBlink 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.orbit-one{animation:robotOrbit 16s linear infinite;transform-origin:300px 300px}
@keyframes robotBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
@keyframes robotHello{0%,15%,60%,100%{transform:rotate(0deg)}27%,43%{transform:rotate(-19deg)}35%,52%{transform:rotate(10deg)}}
@keyframes robotBlink{0%,37%,41%,100%{transform:scaleY(1)}39%{transform:scaleY(.14)}}
@keyframes robotStars{to{opacity:.4}}
@keyframes robotOrbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- Ambient halo and red spacecraft ring -->
<ellipse cx="302" cy="306" rx="295" ry="260" fill="url(#ambient)"/>
<g fill="none" class="orbit-one" stroke-linecap="round">
 <ellipse cx="306" cy="305" rx="283" ry="118" transform="rotate(-17 306 305)" stroke="#ff5265" stroke-width="4" opacity=".42"/>
 <ellipse cx="306" cy="305" rx="283" ry="118" transform="rotate(-17 306 305)" stroke="#f2a2ae" stroke-width="1" opacity=".7"/>
 <path d="M31 307l22-21m449 74l20-17" stroke="#ffb6c1" stroke-width="6"/>
</g>
<g class="robot-stars" fill="#ff7e91">
 <circle cx="55" cy="146" r="4"/><circle cx="505" cy="113" r="3"/><circle cx="551" cy="439" r="3"/><circle cx="120" cy="500" r="2"/>
 <path d="M90 210l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" opacity=".88"/>
 <path d="M529 196l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity=".87"/>
 <path d="M466 61l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
</g>
<!-- A few translucent floating UI tiles -->
<g opacity=".76" filter="url(#smallDrop)">
 <g transform="translate(76 285) rotate(-13)">
  <rect width="76" height="85" rx="17" fill="#101521" fill-opacity=".8" stroke="#fc8090" stroke-opacity=".65"/>
  <rect x="14" y="17" width="48" height="6" rx="3" fill="#e3a1aa" opacity=".65"/>
  <path d="M18 59l11-10 11 5 19-24" stroke="#ff5e71" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="59" cy="30" r="4" fill="#ff5b6d"/>
 </g>
 <g transform="translate(489 297) rotate(15)">
  <rect width="72" height="77" rx="16" fill="#101521" fill-opacity=".75" stroke="#ff8995" stroke-opacity=".57"/>
  <circle cx="36" cy="36" r="17" stroke="#ff7787" stroke-width="3" fill="none"/>
  <path d="M28 38l6 7 13-17" fill="none" stroke="#ff8794" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
</g>
<!-- Floating robot -->
<g class="robot-core" filter="url(#drop)" transform="rotate(-4 318 313)">
 <!-- robot's back right arm -->
 <g transform="translate(410 320) rotate(-13)">
  <ellipse cx="22" cy="22" rx="26" ry="28" fill="#4e5464" stroke="#1b1f2e" stroke-width="5"/>
  <path d="M36 18Q91 4 111-26" stroke="#222638" stroke-width="47" fill="none" stroke-linecap="round"/>
  <path d="M36 18Q91 4 111-26" stroke="url(#silver)" stroke-width="35" fill="none" stroke-linecap="round"/>
  <ellipse cx="109" cy="-29" rx="24" ry="25" fill="url(#silverLite)" stroke="#454956" stroke-width="5"/>
  <path d="M120-49q17-2 26 8m-31 8q24-5 35 7m-41 5q20 0 28 10" fill="none" stroke="#7c8291" stroke-width="8" stroke-linecap="round"/>
  <path d="M137-43q7 5 9 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
 </g>
 <!-- legs + glowing soles -->
 <g transform="translate(281 420) rotate(9)">
  <path d="M-42 0L-68 49" stroke="#1f2532" stroke-width="35" stroke-linecap="round"/>
  <path d="M-42 0L-68 49" stroke="url(#silverLite)" stroke-width="26" stroke-linecap="round"/>
  <g transform="translate(-79 59) rotate(-12)"><rect x="-29" y="-6" width="66" height="41" rx="19" fill="url(#silver)" stroke="#4c5360" stroke-width="5"/><path d="M-20 27q29 13 45 0" stroke="#fe4560" stroke-width="6" stroke-linecap="round"/></g>
  <path d="M55 6l31 55" stroke="#202733" stroke-width="36" stroke-linecap="round"/>
  <path d="M55 6l31 55" stroke="url(#silverLite)" stroke-width="27" stroke-linecap="round"/>
  <g transform="translate(80 67) rotate(17)"><rect x="-24" y="-6" width="68" height="39" rx="18" fill="url(#silver)" stroke="#454b59" stroke-width="5"/><path d="M-13 24q25 10 43-1" stroke="#fc4f60" stroke-width="6" stroke-linecap="round"/></g>
 </g>
 <!-- torso -->
 <g>
  <ellipse cx="313" cy="390" rx="97" ry="115" fill="#222734" stroke="#0b0e1d" stroke-width="5"/>
  <ellipse cx="310" cy="384" rx="88" ry="103" fill="url(#body)" stroke="#f9f9fb" stroke-width="4"/>
  <path d="M251 317Q294 281 355 309" stroke="#fff" stroke-width="11" opacity=".56" fill="none" stroke-linecap="round"/>
  <ellipse cx="319" cy="391" rx="51" ry="57" fill="#202534" stroke="#515c70" stroke-width="6"/>
  <ellipse cx="319" cy="391" rx="38" ry="43" fill="#090d18" stroke="#8e2337" stroke-width="3"/>
  <path d="M314 361l-22 52h18l6-13h17l6 13h19l-24-52zm3 24 5-12 6 12z" fill="#ff4b63" fill-rule="evenodd"/>
  <ellipse cx="319" cy="397" rx="43" ry="48" fill="none" stroke="#ff2446" stroke-width="3" opacity=".65" filter="url(#redGlow)"/>
  <circle cx="266" cy="451" r="6" fill="#fd354d"/><circle cx="363" cy="449" r="5" fill="#555f6c"/>
 </g>
 <!-- left arm extended toward viewer -->
 <g transform="translate(211 337) rotate(-12)">
  <circle cx="0" cy="0" r="28" fill="#272c3b" stroke="#4e5564" stroke-width="4"/>
  <path d="M-10 9L-53-27" stroke="#222636" stroke-width="48" fill="none" stroke-linecap="round"/>
  <path d="M-10 9L-53-27" stroke="url(#silverLite)" stroke-width="35" fill="none" stroke-linecap="round"/>
  <g transform="translate(-68 -37) rotate(-11)">
   <ellipse cx="-4" cy="-1" rx="30" ry="34" fill="url(#silverLite)" stroke="#454958" stroke-width="5"/>
   <path d="M-24-14l-17-25q-9-8-15 0-3 6 4 13l17 29m17-28l-3-34q0-13 9-13 11 0 12 14l4 30" fill="url(#silver)" stroke="#555967" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
   <path d="M3-21l9-28q3-12 11-10 10 3 7 15l-11 37m-10 0l28-24q11-8 16 0 5 7-5 17L18 14" fill="url(#silver)" stroke="#555967" stroke-width="4" stroke-linejoin="round"/>
  </g>
 </g>
 <!-- neck -->
 <rect x="283" y="262" width="69" height="44" rx="18" fill="#303643" stroke="#161b28" stroke-width="5"/>
 <rect x="291" y="271" width="53" height="14" rx="7" fill="#ec435a" opacity=".7"/>
 <!-- ears, behind the glossy head -->
 <g>
  <ellipse cx="187" cy="217" rx="31" ry="57" fill="#242b3a" stroke="#717889" stroke-width="7"/>
  <ellipse cx="187" cy="217" rx="20" ry="46" fill="url(#red)" stroke="#ffa1a9" stroke-width="3"/>
  <ellipse cx="439" cy="217" rx="31" ry="57" fill="#242b3a" stroke="#717889" stroke-width="7"/>
  <ellipse cx="439" cy="217" rx="20" ry="46" fill="url(#red)" stroke="#ffa1a9" stroke-width="3"/>
  <ellipse cx="439" cy="217" rx="24" ry="45" fill="none" stroke="#ff2c48" stroke-width="7" opacity=".6" filter="url(#redGlow)"/>
 </g>
 <!-- giant round head with silver rim -->
 <g>
  <rect x="186" y="99" width="256" height="194" rx="87" fill="#252b39" stroke="#141b29" stroke-width="10"/>
  <rect x="179" y="94" width="256" height="191" rx="86" fill="url(#silver)" stroke="#f9f9fc" stroke-width="5"/>
  <path d="M218 131q71-51 168-12" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".7"/>
  <rect x="199" y="129" width="219" height="139" rx="61" fill="#090f19" stroke="#6b7383" stroke-width="8"/>
  <rect x="209" y="135" width="203" height="128" rx="56" fill="url(#visor)" stroke="#141722" stroke-width="2"/>
  <!-- screen reflection -->
  <path d="M239 144q51-22 115-5" fill="none" stroke="#bbccdd" stroke-opacity=".22" stroke-width="13" stroke-linecap="round"/>
  <path d="M385 171q15 24 13 51" fill="none" stroke="#d1d1dc" stroke-opacity=".17" stroke-width="8" stroke-linecap="round"/>
  <!-- lights under the eyes -->
  <ellipse cx="249" cy="224" rx="17" ry="9" fill="#fb4056" opacity=".62" filter="url(#eyeBlush)"/>
  <ellipse cx="369" cy="224" rx="17" ry="9" fill="#fb4056" opacity=".62" filter="url(#eyeBlush)"/>
  <!-- smiling eyes -->
  <g class="robot-eyes" stroke="url(#eyeGlow)" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="12">
   <path d="M239 195q22-31 46 0" />
   <path d="M336 195q22-31 46 0"/>
  </g>
  <path d="M291 221q18 14 36 0" fill="none" stroke="#ffa1ad" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <!-- crest at helmet forehead -->
  <path d="M294 113l16-10 16 10-16 10z" fill="#3e4756" stroke="#f7f7f7" stroke-width="2"/>
  <circle cx="310" cy="113" r="3.6" fill="#ff4a5e"/>
  <!-- cheek rivets -->
  <circle cx="195" cy="251" r="5" fill="#727a88"/><circle cx="418" cy="251" r="5" fill="#727a88"/>
 </g>
 <!-- Waving antenna and hand on top-right -->
 <g transform="translate(390 126) rotate(17)"><g class="robot-hello">
  <path d="M0 0q31-29 52-60" stroke="#303644" stroke-width="30" fill="none" stroke-linecap="round"/>
  <path d="M0 0q31-29 52-60" stroke="url(#silverLite)" stroke-width="22" fill="none" stroke-linecap="round"/>
  <ellipse cx="57" cy="-66" rx="28" ry="27" fill="url(#silver)" stroke="#434959" stroke-width="5"/>
  <path d="M40-80l-7-26q-2-11 6-14 10-1 12 13l6 19m2-2l2-30q1-13 10-11 8 1 8 11l-1 30m4 4 10-23q6-10 14-7 6 4 2 14L95-62" fill="url(#silverLite)" stroke="#555b67" stroke-width="4" stroke-linecap="round"/>
  <circle cx="55" cy="-62" r="7" fill="#ff5269" opacity=".75"/>
 </g>
</g>
</g>
<!-- foreground short arc -->
<path d="M120 442C204 521 424 524 544 402" fill="none" stroke="#ff596c" stroke-opacity=".42" stroke-width="4" stroke-linecap="round"/>
<path d="M125 447C207 523 428 526 549 403" fill="none" stroke="#ffb2bb" stroke-opacity=".27" stroke-width="1" stroke-linecap="round"/>
</svg>